<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>THEME.BY</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="logo">THEME.BY</div>

  <div class="power-wrapper">
    <button id="toggleTheme" class="power-btn" aria-pressed="true" aria-label="Toggle theme on or off">
      <span id="powerText">ON</span>
    </button>
  </div>

  <div class="section-title">Appearance</div>

  <div class="theme-list" role="radiogroup" aria-label="Theme appearance">

    <button class="theme-row" data-theme="light" role="radio" aria-checked="false">
      <span class="theme-label">Light</span>
      <span class="chevron">&#8250;</span>
    </button>

    <button class="theme-row" data-theme="dark" role="radio" aria-checked="false">
      <span class="theme-label">Dark</span>
      <span class="chevron">&#8250;</span>
    </button>

  </div>

  <div class="status-line" id="statusLine">Theme is active on cet.iitp.ac.in</div>

  <script src="popup.js"></script>
</body>
</html>
